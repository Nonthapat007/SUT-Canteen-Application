name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (07:00 AM Thailand time)
    - cron: '0 0 */3 * *'
  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  ping:
    name: Keep Supabase Active
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: 'https://yhhsfeixpzxqqosajouc.supabase.co'
          # Uses secret if configured, otherwise falls back to anon key
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloaHNmZWl4cHp4cXFvc2Fqb3VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDkzMTUsImV4cCI6MjEwNDUyNTMxNX0.1Zqm8fG5xQZrdI9bE2E0Pa7P8dK9lwOP_0ngbizXIkY' }}
        run: |
          echo "Sending keep-alive request to Supabase..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$SUPABASE_URL/rest/v1/canteens?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body: $BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase is alive and activity timer has been successfully reset!"
            exit 0
          else
            echo "❌ Failed to ping Supabase, returned status $HTTP_STATUS"
            exit 1
          fi
